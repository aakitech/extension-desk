[project]
name = "extension-desk"
version = "0.1.0"
description = "Agentic extension-office assistant: sourced advisory drafts with officer approval."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "mcp",
    "langgraph",
    "langchain-mcp-adapters",
    "pydantic>=2",
]

[project.scripts]
extension-desk-mcp = "extension_desk.mcp_server.server:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extension_desk"]
